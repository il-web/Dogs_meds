<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DogMeds</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0b12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b12;
            --surface: #151520;
            --surface2: #1e1e30;
            --border: rgba(255,255,255,0.06);
            --green: #00d68f;
            --green-dim: #00b377;
            --green-glow: rgba(0,214,143,0.25);
            --green-bg: rgba(0,214,143,0.08);
            --blue: #3b82f6;
            --blue-glow: rgba(59,130,246,0.25);
            --orange: #ffa502;
            --red: #ff4757;
            --text: #f0f0f5;
            --text2: #8888a0;
            --text3: #50506a;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            font-family: 'Heebo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
        }

        /* === SCREENS === */
        .screen { display: none; flex-direction: column; flex: 1; }
        .screen.active { display: flex; }

        /* === WELCOME SCREEN === */
        .welcome {
            align-items: center;
            justify-content: center;
            gap: 32px;
            text-align: center;
        }

        .welcome-emoji { font-size: 72px; animation: welcomeBounce 2s ease-in-out infinite; }

        @keyframes welcomeBounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.3;
        }

        .welcome p {
            font-size: 15px;
            color: var(--text2);
            line-height: 1.6;
            max-width: 280px;
        }

        .welcome-input-wrap {
            width: 100%;
            max-width: 300px;
        }

        .welcome-input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-family: 'Heebo', sans-serif;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .welcome-input:focus { border-color: var(--green); }

        .welcome-input::placeholder { color: var(--text3); }

        .welcome-btn {
            width: 100%;
            max-width: 300px;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: var(--green);
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .welcome-btn:active { transform: scale(0.97); }
        .welcome-btn:disabled { background: var(--surface2); color: var(--text3); cursor: not-allowed; }

        /* === MAIN SCREEN === */
        .main {
            gap: 0;
        }

        /* Greeting */
        .greeting {
            margin-bottom: 8px;
        }

        .greeting h2 {
            font-size: 22px;
            font-weight: 700;
        }

        .greeting h2 span {
            color: var(--green);
        }

        .greeting .time-now {
            font-size: 13px;
            color: var(--text3);
            margin-top: 2px;
        }

        /* === BIG BUTTON AREA === */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
        }

        /* Status text above button */
        .hero-status {
            font-size: 14px;
            color: var(--text2);
            text-align: center;
            line-height: 1.5;
        }

        .hero-status .next-time {
            font-weight: 700;
            color: var(--text);
            font-size: 16px;
        }

        .hero-status .dose-label {
            color: var(--text3);
            font-size: 12px;
        }

        /* The big button */
        .big-btn-wrap {
            position: relative;
        }

        .big-btn-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.5s;
        }

        .big-btn-ring.pulse {
            border-color: var(--green);
            animation: ringPulse 2.5s ease-in-out infinite;
        }

        .big-btn-ring.pulse-blue {
            border-color: var(--blue);
            animation: ringPulseBlue 2.5s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%,100% { box-shadow: 0 0 0 0 var(--green-glow); }
            50% { box-shadow: 0 0 0 16px transparent; }
        }

        @keyframes ringPulseBlue {
            0%,100% { box-shadow: 0 0 0 0 var(--blue-glow); }
            50% { box-shadow: 0 0 0 16px transparent; }
        }

        .big-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Heebo', sans-serif;
            transition: all 0.2s;
            position: relative;
            z-index: 1;
        }

        .big-btn:active { transform: scale(0.95); }

        .big-btn .btn-emoji { font-size: 36px; }
        .big-btn .btn-text { font-size: 15px; font-weight: 700; line-height: 1.3; text-align: center; padding: 0 12px; }

        /* Button states */
        .big-btn.give {
            background: linear-gradient(145deg, #00e09a, #00b377);
            color: #fff;
            box-shadow: 0 8px 32px var(--green-glow);
        }

        .big-btn.early {
            background: linear-gradient(145deg, #5b9cf6, #2563eb);
            color: #fff;
            box-shadow: 0 8px 32px var(--blue-glow);
        }

        .big-btn.done {
            background: var(--surface);
            border: 2px solid rgba(0,214,143,0.2);
            color: var(--green);
            cursor: default;
            box-shadow: none;
        }

        .big-btn.done:active { transform: none; }

        .big-btn.waiting {
            background: var(--surface);
            border: 2px solid var(--border);
            color: var(--text3);
            cursor: default;
            box-shadow: none;
        }

        .big-btn.waiting:active { transform: none; }

        /* Given info */
        .given-info {
            text-align: center;
            font-size: 13px;
            color: var(--text2);
            line-height: 1.5;
        }

        .given-info .by-name {
            font-weight: 700;
            color: var(--text);
        }

        .given-info .esp-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(255,165,2,0.12);
            color: var(--orange);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        /* Next dose info */
        .next-dose-info {
            text-align: center;
            font-size: 14px;
            color: var(--text2);
        }

        .next-dose-info .next-val {
            font-weight: 700;
            color: var(--text);
        }

        /* === BOTTOM SECTION === */
        .bottom {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Today summary */
        .today-bar {
            display: flex;
            gap: 6px;
        }

        .today-dot {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--surface2);
            position: relative;
            overflow: hidden;
        }

        .today-dot.given { background: var(--green); }
        .today-dot.active { background: var(--orange); animation: dotPulse 1.5s ease-in-out infinite; }
        .today-dot.missed { background: var(--red); }

        @keyframes dotPulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

        .today-labels {
            display: flex;
            justify-content: space-between;
            padding: 0 2px;
        }

        .today-label {
            font-size: 11px;
            color: var(--text3);
            font-weight: 500;
        }

        .today-label.active { color: var(--orange); font-weight: 700; }
        .today-label.given { color: var(--green); }
        .today-label.missed { color: var(--red); }

        /* History toggle */
        .history-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text2);
            font-family: 'Heebo', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .history-btn:active { background: var(--surface2); }

        /* History panel */
        .history-panel {
            display: none;
            flex-direction: column;
            gap: 1px;
            background: var(--surface);
            border-radius: 14px;
            border: 1px solid var(--border);
            overflow: hidden;
            max-height: 300px;
            overflow-y: auto;
        }

        .history-panel.open { display: flex; }

        .history-panel::-webkit-scrollbar { display: none; }

        .h-day {
            padding: 10px 16px 4px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text3);
            letter-spacing: 0.5px;
            background: var(--surface);
        }

        .h-item {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .h-item .h-who { font-size: 13px; font-weight: 600; }
        .h-item .h-when { font-size: 12px; color: var(--text2); direction: ltr; }

        .h-empty { padding: 20px; text-align: center; color: var(--text3); font-size: 13px; }

        /* === CONFIRM OVERLAY === */
        .confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .confirm-overlay.show { display: flex; }

        .confirm-box {
            background: var(--surface);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 32px 24px 24px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            animation: confirmPop 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
        }

        @keyframes confirmPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .confirm-box .c-emoji { font-size: 48px; margin-bottom: 12px; }
        .confirm-box .c-text { font-size: 16px; color: var(--text2); margin-bottom: 24px; line-height: 1.5; }
        .confirm-box .c-text strong { color: var(--text); }

        .confirm-btns { display: flex; gap: 10px; }

        .confirm-btns button {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-family: 'Heebo', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .c-cancel { background: var(--surface2); color: var(--text2); }
        .c-ok { background: var(--green); color: #fff; }

        /* === TOAST === */
        .toast {
            position: fixed;
            top: calc(20px + var(--safe-top));
            left: 50%; transform: translateX(-50%) translateY(-100px);
            background: var(--surface2);
            border: 1px solid var(--green);
            border-radius: 14px;
            padding: 12px 20px;
            display: flex; align-items: center; gap: 10px;
            z-index: 200;
            transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast-text { font-size: 14px; font-weight: 600; }

        .toast-undo {
            padding: 4px 12px; border-radius: 8px;
            border: 1px solid var(--green); background: transparent;
            color: var(--green); font-family: 'Heebo', sans-serif;
            font-size: 12px; font-weight: 700; cursor: pointer;
        }

        /* === LOADING === */
        .loading-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 300; transition: opacity 0.4s;
        }

        .loading-screen.hide { opacity: 0; pointer-events: none; }
        .loading-dog { font-size: 56px; animation: loadBounce 1s ease-in-out infinite; }

        @keyframes loadBounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .loading-bar {
            width: 100px; height: 3px; background: var(--surface2);
            border-radius: 2px; margin-top: 20px; overflow: hidden;
        }

        .loading-bar::after {
            content: ''; display: block; width: 40%; height: 100%;
            background: var(--green); border-radius: 2px;
            animation: loadSlide 1s ease-in-out infinite;
        }

        @keyframes loadSlide { 0%{transform:translateX(-100%);} 100%{transform:translateX(350%);} }

        /* === NOTIFICATION BANNER (small) === */
        .notif-mini {
            display: none;
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text2);
        }

        .notif-mini.show { display: flex; }

        .notif-mini button {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: var(--green);
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Settings link */
        .settings-link {
            text-align: center;
            margin-top: 4px;
        }

        .settings-link button {
            background: none; border: none;
            color: var(--text3); font-family: 'Heebo', sans-serif;
            font-size: 12px; cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-dog">🐕</div>
        <div class="loading-bar"></div>
    </div>

    <div class="toast" id="toast">
        <span>✓</span>
        <span class="toast-text" id="toastText"></span>
        <button class="toast-undo" id="toastUndo">ביטול</button>
    </div>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <div class="c-emoji">💊</div>
            <div class="c-text" id="confirmText"></div>
            <div class="confirm-btns">
                <button class="c-cancel" id="confirmCancel">ביטול</button>
                <button class="c-ok" id="confirmOk">אישור</button>
            </div>
        </div>
    </div>

    <div class="app">
        <!-- WELCOME SCREEN -->
        <div class="screen welcome" id="welcomeScreen">
            <div class="welcome-emoji">🐕💊</div>
            <h1>שלום!<br>מי את/ה?</h1>
            <p>כתוב את השם שלך כדי שנדע מי נתן את הכדור לזקי</p>
            <div class="welcome-input-wrap">
                <input class="welcome-input" type="text" id="nameInput" placeholder="השם שלך..." maxlength="20" autocomplete="off">
            </div>
            <button class="welcome-btn" id="welcomeBtn" disabled>יאללה, בוא נתחיל</button>
        </div>

        <!-- MAIN SCREEN -->
        <div class="screen main" id="mainScreen">
            <div class="greeting">
                <h2>שלום, <span id="userName"></span> 👋</h2>
                <div class="time-now" id="timeNow"></div>
            </div>

            <div class="hero">
                <div class="hero-status" id="heroStatus"></div>

                <div class="big-btn-wrap">
                    <div class="big-btn-ring" id="btnRing"></div>
                    <button class="big-btn" id="bigBtn">
                        <span class="btn-emoji" id="btnEmoji"></span>
                        <span class="btn-text" id="btnText"></span>
                    </button>
                </div>

                <div id="heroInfo"></div>
            </div>

            <div class="bottom">
                <div class="notif-mini" id="notifBanner">
                    <span>🔔 קבל תזכורות</span>
                    <button id="notifBtn">אפשר</button>
                </div>

                <div class="today-bar" id="todayBar"></div>
                <div class="today-labels" id="todayLabels"></div>

                <button class="history-btn" id="historyBtn">📋 היסטוריה</button>
                <div class="history-panel" id="historyPanel"></div>

                <div class="settings-link">
                    <button id="changeName">שנה שם</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPA_URL = 'https://sufelldngosrvtpxyqqo.supabase.co';
        const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1ZmVsbGRuZ29zcnZ0cHh5cXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyOTkxMTIsImV4cCI6MjA4Nzg3NTExMn0.Z4ab5FMx7P076TlGQtvnK5yUVge_igG5rzZje7vsJRk';

        const DOSES = [
            { hour: 7, minute: 30, label: 'בוקר' },
            { hour: 15, minute: 30, label: 'צהריים' },
            { hour: 19, minute: 30, label: 'ערב' },
            { hour: 23, minute: 30, label: 'לילה' },
        ];
        const EARLY_MIN = 20;
        const DOG_NAME = 'זקי';

        let myName = localStorage.getItem('dm_name') || '';
        let logs = [];
        let lastId = null;

        // === SUPABASE ===
        async function supa(path, opts = {}) {
            const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
                headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Content-Type': 'application/json', 'Prefer': opts.prefer || 'return=representation' },
                ...opts
            });
            if (!r.ok) throw new Error(r.status);
            const t = await r.text();
            return t ? JSON.parse(t) : null;
        }

        async function loadLogs() {
            logs = (await supa('med_logs?order=given_at.desc&limit=100')) || [];
        }

        // === DOSE LOGIC ===
        function getDoses() {
            const now = new Date();
            const today = new Date(now); today.setHours(0,0,0,0);
            const todayLogs = logs.filter(l => new Date(l.given_at) >= today);

            return DOSES.map((d, i) => {
                const dt = new Date(today); dt.setHours(d.hour, d.minute, 0, 0);
                const earlyT = new Date(dt.getTime() - EARLY_MIN * 60000);

                const prev = i > 0 ? new Date(today).setHours(DOSES[i-1].hour, DOSES[i-1].minute) : today.getTime();
                const next = i < DOSES.length-1 ? new Date(today).setHours(DOSES[i+1].hour, DOSES[i+1].minute) : today.getTime() + 86400000;
                const wStart = new Date((prev + dt.getTime()) / 2);
                const wEnd = new Date((dt.getTime() + next) / 2);

                const match = todayLogs.find(l => { const x = new Date(l.given_at); return x >= wStart && x < wEnd; });

                let status;
                if (match) status = 'given';
                else if (now >= earlyT && now < dt) status = 'early';
                else if (now >= dt && now < wEnd) status = 'active';
                else if (now >= wEnd) status = 'missed';
                else status = 'upcoming';

                return { ...d, index: i, doseTime: dt, status, givenBy: match?.given_by, givenAt: match?.given_at, logId: match?.id };
            });
        }

        function getCurrentDose() {
            const doses = getDoses();
            // Priority: active > early > missed > upcoming (first)
            return doses.find(d => d.status === 'active')
                || doses.find(d => d.status === 'early')
                || doses.find(d => d.status === 'missed')
                || doses.find(d => d.status === 'upcoming')
                || doses[doses.length - 1]; // fallback: last dose
        }

        function getNextDose(doses) {
            const current = doses.find(d => d.status === 'active' || d.status === 'early');
            if (current) {
                const ts = fmtTime(current.hour, current.minute);
                return { label: current.label, time: ts };
            }
            // Find next upcoming or first one not given
            const next = doses.find(d => d.status === 'upcoming');
            if (next) return { label: next.label, time: fmtTime(next.hour, next.minute) };

            // All done today or missed — show tomorrow morning
            return { label: 'מחר בבוקר', time: '07:30' };
        }

        function fmtTime(h, m) { return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }

        // === RENDER ===
        function render() {
            const now = new Date();
            document.getElementById('timeNow').textContent = now.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('userName').textContent = myName;

            const doses = getDoses();
            const focus = getCurrentDose();
            const btn = document.getElementById('bigBtn');
            const ring = document.getElementById('btnRing');
            const emoji = document.getElementById('btnEmoji');
            const text = document.getElementById('btnText');
            const status = document.getElementById('heroStatus');
            const info = document.getElementById('heroInfo');

            const focusTime = fmtTime(focus.hour, focus.minute);

            btn.onclick = null;
            ring.className = 'big-btn-ring';

            if (focus.status === 'active') {
                // Needs to give NOW
                emoji.textContent = '💊';
                text.textContent = 'נתתי כדור!';
                btn.className = 'big-btn give';
                ring.classList.add('pulse');
                status.innerHTML = `<div>הגיע הזמן! מנת <strong>${focus.label}</strong></div><div class="next-time">${focusTime}</div>`;
                info.innerHTML = '';
                btn.onclick = () => promptGive(focus.index, false);

            } else if (focus.status === 'early') {
                // Can give early
                emoji.textContent = '🕐';
                text.textContent = 'לתת מוקדם';
                btn.className = 'big-btn early';
                ring.classList.add('pulse-blue');
                status.innerHTML = `<div>הכדור הבא ב-<span class="next-time">${focusTime}</span></div><div class="dose-label">אפשר לתת עכשיו מוקדם</div>`;
                info.innerHTML = '';
                btn.onclick = () => promptGive(focus.index, true);

            } else if (focus.status === 'given') {
                // Current/recent dose was given
                const givenTime = new Date(focus.givenAt).toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' });
                const espTag = focus.givenBy === 'ESP32' ? ' <span class="esp-tag">⚡ ESP32</span>' : '';
                emoji.textContent = '✅';
                text.textContent = 'ניתן!';
                btn.className = 'big-btn done';
                btn.onclick = null;

                const nextDose = getNextDose(doses);
                status.innerHTML = `<div>הכדור של ${focusTime} ניתן ✓</div>`;
                info.innerHTML = `
                    <div class="given-info">
                        <span class="by-name">${focus.givenBy}</span>${espTag} נתנ/ה ב-${givenTime}
                    </div>
                    <br>
                    <div class="next-dose-info">הכדור הבא: <span class="next-val">${nextDose.time}</span> (${nextDose.label})</div>
                `;

            } else if (focus.status === 'missed') {
                emoji.textContent = '⚠️';
                text.textContent = 'תת עכשיו!';
                btn.className = 'big-btn give';
                ring.classList.add('pulse');
                status.innerHTML = `<div style="color:var(--red)">פספסנו את מנת ה${focus.label} (${focusTime})</div>`;
                info.innerHTML = '';
                btn.onclick = () => promptGive(focus.index, false);

            } else if (focus.status === 'upcoming') {
                emoji.textContent = '⏳';
                text.textContent = 'ממתין';
                btn.className = 'big-btn waiting';
                btn.onclick = null;
                status.innerHTML = `<div>הכדור הבא</div><div class="next-time">${focusTime}</div><div class="dose-label">${focus.label}</div>`;
                info.innerHTML = '';
            }

            // Today progress bar
            const bar = document.getElementById('todayBar');
            const labels = document.getElementById('todayLabels');
            bar.innerHTML = doses.map(d => `<div class="today-dot ${d.status}"></div>`).join('');
            labels.innerHTML = doses.map(d => {
                const cls = d.status === 'active' ? 'active' : d.status === 'given' ? 'given' : d.status === 'missed' ? 'missed' : '';
                return `<span class="today-label ${cls}">${fmtTime(d.hour, d.minute)}</span>`;
            }).join('');

            renderHistory();
        }

        function renderHistory() {
            const el = document.getElementById('historyPanel');
            if (!logs.length) { el.innerHTML = '<div class="h-empty">אין רשומות</div>'; return; }

            let html = '', curDay = '';
            logs.slice(0, 30).forEach(log => {
                const d = new Date(log.given_at);
                const ds = d.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
                const t = d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });

                if (ds !== curDay) {
                    curDay = ds;
                    const today = new Date(); today.setHours(0,0,0,0);
                    const ld = new Date(d); ld.setHours(0,0,0,0);
                    const diff = Math.floor((today - ld) / 86400000);
                    let lbl = ds;
                    if (diff === 0) lbl = 'היום';
                    else if (diff === 1) lbl = 'אתמול';
                    html += `<div class="h-day">${lbl}</div>`;
                }

                const esp = log.given_by === 'ESP32' ? ' <span class="esp-tag" style="display:inline-flex;align-items:center;gap:3px;background:rgba(255,165,2,0.12);color:#ffa502;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;">⚡ ESP32</span>' : '';
                html += `<div class="h-item"><span class="h-who">${log.given_by}${esp}</span><span class="h-when">${t}</span></div>`;
            });
            el.innerHTML = html;
        }

        // === ACTIONS ===
        function promptGive(idx, early) {
            const d = DOSES[idx];
            const ts = fmtTime(d.hour, d.minute);
            const earlyTxt = early ? ' (מוקדם)' : '';
            document.getElementById('confirmText').innerHTML = `<strong>${myName}</strong> נותנ/ת כדור ל${DOG_NAME}<br>מנת ${d.label} — ${ts}${earlyTxt}`;
            document.getElementById('confirmOverlay').classList.add('show');

            document.getElementById('confirmOk').onclick = async () => {
                document.getElementById('confirmOverlay').classList.remove('show');
                try {
                    const data = await supa('med_logs', { method: 'POST', body: JSON.stringify({ given_by: myName }) });
                    lastId = data?.[0]?.id;
                    showToast(`${myName} נתנ/ה כדור ל${DOG_NAME} ✓`);
                    await loadLogs();
                    render();
                } catch(e) { alert('שגיאה'); console.error(e); }
            };
        }

        function showToast(msg) {
            document.getElementById('toastText').textContent = msg;
            const t = document.getElementById('toast');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 5000);
        }

        async function undoLast() {
            if (!lastId) return;
            try {
                await supa(`med_logs?id=eq.${lastId}`, { method: 'DELETE', prefer: 'return=minimal' });
                lastId = null;
                document.getElementById('toast').classList.remove('show');
                await loadLogs(); render();
            } catch(e) { alert('שגיאה'); }
        }

        // === NOTIFICATIONS ===
        function checkNotif() {
            if ('Notification' in window && Notification.permission === 'default') {
                document.getElementById('notifBanner').classList.add('show');
            }
        }

        function startNotifLoop() { setInterval(checkAndNotify, 60000); checkAndNotify(); }

        function checkAndNotify() {
            if (Notification.permission !== 'granted') return;
            getDoses().filter(d => d.status === 'active').forEach(dose => {
                const key = `notif_${dose.index}_${new Date().toDateString()}`;
                const last = parseInt(localStorage.getItem(key) || '0');
                if (Date.now() - last >= 5 * 60000) {
                    new Notification(`💊 הגיע הזמן לתת כדור ל${DOG_NAME}!`, {
                        body: `מנת ${dose.label} (${fmtTime(dose.hour, dose.minute)})`,
                        icon: 'icon-192.png',
                        tag: `dose-${dose.index}`,
                        renotify: true,
                    });
                    localStorage.setItem(key, String(Date.now()));
                }
            });
        }

        // === EVENTS ===
        document.getElementById('nameInput').oninput = e => {
            document.getElementById('welcomeBtn').disabled = !e.target.value.trim();
        };

        document.getElementById('nameInput').onkeyup = e => {
            if (e.key === 'Enter' && e.target.value.trim()) startApp(e.target.value.trim());
        };

        document.getElementById('welcomeBtn').onclick = () => {
            const n = document.getElementById('nameInput').value.trim();
            if (n) startApp(n);
        };

        function startApp(name) {
            myName = name;
            localStorage.setItem('dm_name', name);
            document.getElementById('welcomeScreen').classList.remove('active');
            document.getElementById('mainScreen').classList.add('active');
            render();
        }

        document.getElementById('confirmCancel').onclick = () => document.getElementById('confirmOverlay').classList.remove('show');
        document.getElementById('confirmOverlay').onclick = e => { if (e.target === e.currentTarget) e.target.classList.remove('show'); };
        document.getElementById('toastUndo').onclick = undoLast;

        document.getElementById('historyBtn').onclick = () => {
            document.getElementById('historyPanel').classList.toggle('open');
        };

        document.getElementById('changeName').onclick = () => {
            localStorage.removeItem('dm_name');
            myName = '';
            document.getElementById('mainScreen').classList.remove('active');
            document.getElementById('welcomeScreen').classList.add('active');
            document.getElementById('nameInput').value = '';
            document.getElementById('welcomeBtn').disabled = true;
        };

        document.getElementById('notifBtn').onclick = async () => {
            if (!('Notification' in window)) return;
            await Notification.requestPermission();
            document.getElementById('notifBanner').classList.remove('show');
            if (Notification.permission === 'granted') startNotifLoop();
        };

        // Auto refresh
        setInterval(async () => { try { await loadLogs(); render(); } catch(e){} }, 30000);
        setInterval(() => { if (myName) render(); }, 60000);

        // === INIT ===
        (async () => {
            try {
                await loadLogs();
                if (myName) {
                    document.getElementById('mainScreen').classList.add('active');
                    render();
                } else {
                    document.getElementById('welcomeScreen').classList.add('active');
                }
                checkNotif();
                if (Notification.permission === 'granted') startNotifLoop();
                setTimeout(() => document.getElementById('loadingScreen').classList.add('hide'), 400);
            } catch(e) {
                console.error(e);
                document.getElementById('loadingScreen').innerHTML =
                    `<div style="text-align:center;color:var(--red);padding:20px;font-family:'Heebo',sans-serif;">
                        שגיאה בחיבור לשרת<br>
                        <button onclick="location.reload()" style="margin-top:16px;padding:12px 32px;border-radius:14px;border:1px solid var(--red);background:transparent;color:var(--red);font-family:'Heebo';font-size:14px;cursor:pointer;">נסה שוב</button>
                    </div>`;
            }
        })();
    </script>
</body>
</html>
